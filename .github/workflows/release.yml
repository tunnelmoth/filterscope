name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  wheel:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel
          path: dist/*

  binaries:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: filterscope-windows-x86_64.exe
            built: dist/filterscope.exe
          - os: ubuntu-22.04
            asset: filterscope-linux-x86_64
            built: dist/filterscope
          - os: macos-14
            asset: filterscope-macos-arm64
            built: dist/filterscope
          # macos-13 (Intel) runners are retired on GitHub; Intel Macs: pip/pipx install.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pyinstaller --clean --noconfirm packaging/filterscope.spec
      - run: pyinstaller --clean --noconfirm packaging/filterscope-gui.spec
      - name: smoke test
        run: ${{ matrix.built }} --version
      - name: installer (Inno Setup, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "${env:GITHUB_REF_NAME}".TrimStart("v")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$v packaging\installer.iss
          Get-ChildItem dist
      - name: package (self-explanatory names)
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          case "${{ runner.os }}" in
            Windows)
              mv dist/filterscope.exe     "dist/filterscope-$v-Windows-Terminal.exe"
              mv dist/filterscope-gui.exe "dist/filterscope-$v-Windows-Portable.exe"
              mv "dist/filterscope-setup-$v.exe" "dist/filterscope-$v-Windows-Installer.exe" ;;
            Linux)
              mv dist/filterscope     "dist/filterscope-$v-Linux-Terminal"
              mv dist/filterscope-gui "dist/filterscope-$v-Linux-App" ;;
            macOS)
              mv dist/filterscope "dist/filterscope-$v-macOS-AppleSilicon-Terminal"
              rm -f dist/filterscope-gui
              (cd dist && zip -qr "filterscope-$v-macOS-AppleSilicon.app.zip" filterscope.app && rm -rf filterscope.app) ;;
          esac
          rm -rf dist/filterscope.app
          ls -la dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/filterscope-*
            !dist/*.spec

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          v="${GITHUB_REF_NAME#v}"
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/filterscope-$v-Android.apk"
          ls -la ../dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-apk
          path: dist/filterscope-*-Android.apk

  publish:
    needs: [wheel, binaries, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: out
          merge-multiple: true
      - name: checksums
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: release notes
        run: |
          v="${GITHUB_REF_NAME#v}"
          {
            echo "## Which file do I need?"
            echo
            echo "| You are on | Download | Notes |"
            echo "|---|---|---|"
            echo "| **Windows** | \`filterscope-$v-Windows-Installer.exe\` | Recommended. Start-menu shortcut, no administrator rights. SmartScreen warns because the file is not signed. Choose More info, then Run anyway. |"
            echo "| Windows, no install | \`filterscope-$v-Windows-Portable.exe\` | Single file, double-click. |"
            echo "| Windows, terminal | \`filterscope-$v-Windows-Terminal.exe\` | TUI + CLI (scan, compare, history…). |"
            echo "| **Android** | \`filterscope-$v-Android.apk\` | Android 7 or newer, 64-bit. Allow unknown sources once. |"
            echo "| **Linux** | \`filterscope-$v-Linux-App\` | Run chmod +x, then start it. Terminal build: \`…-Linux-Terminal\`. |"
            echo "| **macOS** (Apple silicon) | \`filterscope-$v-macOS-AppleSilicon.app.zip\` | Unzip it. Open it with a right-click the first time. Intel Macs use pip (below). |"
            echo "| Python 3.10+ (any OS) | \`filterscope-$v-py3-none-any.whl\` | pip install the file, or pipx install git+https://github.com/tunnelmoth/filterscope |"
            echo
            echo "Verify each file: compare its SHA-256 with \`SHA256SUMS.txt\`. Website: https://tunnelmoth.github.io/filterscope/"
            echo
            echo "## Changes"
            echo
            awk -v tag="$v" '
              /^## / { if (found) exit; if (index($0, tag)) { found=1; next } }
              found { print }' CHANGELOG.md
          } > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: "filterscope ${{ github.ref_name }} — stable"
          body_path: notes.md
          files: out/*
