[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "filterscope"
version = "3.3.114"
description = "Measure network filtering/censorship legitimately — DNS, SNI-DPI, block pages, ports, UDP/QUIC, encrypted DNS, Tor — with your own traffic and a clean allowlist."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [{ name = "tunnelmoth" }]
keywords = ["censorship", "network-measurement", "dpi", "sni", "dns", "digital-rights", "ooni"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Internet",
  "Topic :: Security",
  "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
  "requests>=2.28",
  "certifi",
  "dnspython>=2.4",
  "cryptography>=41",
  "rich>=13",
  "textual>=0.80",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pyinstaller>=6.6"]

[project.urls]
Homepage = "https://github.com/tunnelmoth/filterscope"
Issues = "https://github.com/tunnelmoth/filterscope/issues"

[project.scripts]
filterscope = "filterscope.cli:main"

[project.gui-scripts]
filterscope-gui = "filterscope.gui:main"

[tool.setuptools.packages.find]
include = ["filterscope*"]

[tool.setuptools.package-data]
filterscope = ["scripts/*.sh", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
